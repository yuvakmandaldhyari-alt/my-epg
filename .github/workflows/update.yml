name: Update EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my-epg
        uses: actions/checkout@v4

      - name: Checkout iptv-org/epg
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          path: epg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: epg/package-lock.json

      - name: Install dependencies
        working-directory: epg
        run: npm install

      - name: Copy custom channel list
        run: cp airtelxstream.in.channels.xml epg/custom.channels.xml

      - name: Generate XMLTV guide
        working-directory: epg
        run: npm run grab --- --channels=custom.channels.xml --output=../guide.xml

      - name: Commit guide.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide.xml
          git diff --cached --quiet || git commit -m "Update XMLTV EPG"
          git push

      - name: Upload guide.xml to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp guide.xml s3://my-epg-guide/guide.xml \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --content-type "application/xml" \
            --cache-control "no-cache, max-age=300"
